[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "recall-client"
version = "0.1.0"
description = "Recall-AI Mac capture client: camera + mic -> backend, persona overlay"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "sounddevice>=0.4.6",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["recall_client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
